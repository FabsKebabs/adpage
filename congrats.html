
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Congratulations!</title>
  <style>
    body {
      background: linear-gradient(135deg, #0f0f1f 0%, #1f1f3f 100%);
      font-family: 'Orbitron', sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      text-align: center;
      overflow: hidden;
    }
    
    .congrats-container {
      position: relative;
      z-index: 2;
    }
    
    .congrats-text {
      font-size: 3.5rem;
      text-shadow: 0 0 10px #0ff,
                   0 0 20px #f0f;
      animation: glowText 2s ease-in-out infinite alternate;
      margin-bottom: 1rem;
    }
    
    .sub-text {
      font-size: 1.5rem;
      color: #0ff;
      animation: float 3s ease-in-out infinite;
      margin-bottom: 2rem;
    }

    .back-button {
      padding: 0.8rem 2rem;
      font-size: 1rem;
      color: #fff;
      background: linear-gradient(45deg, rgba(255, 0, 255, 0.1), rgba(0, 255, 255, 0.1));
      border: 2px solid #f0f;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      margin-top: 1rem;
      box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
    }

    .back-button:hover {
      background: linear-gradient(45deg, rgba(255, 0, 255, 0.2), rgba(0, 255, 255, 0.2));
      border-color: #0ff;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
    }
    
    .particles {
      position: fixed;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    @keyframes glowText {
      from { text-shadow: 0 0 10px #0ff, 0 0 20px #f0f; }
      to { text-shadow: 0 0 20px #0ff, 0 0 40px #f0f; }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Add sparkle animation */
    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      animation: sparkle 1.5s linear infinite;
    }

    @keyframes sparkle {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0); opacity: 0; }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="congrats-container">
    <div class="congrats-text">WOOHOO! 🎉</div>
    <div class="sub-text">You've Successfully Entered the Giveaway!</div>
    <a href="./" class="back-button">Go Back</a>
  </div>
  <script>
    // Add random sparkles
    function createSparkle() {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.style.left = Math.random() * window.innerWidth + 'px';
      sparkle.style.top = Math.random() * window.innerHeight + 'px';
      document.body.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 1500);
    }
    setInterval(createSparkle, 200);
  </script>
</body>
</html>
